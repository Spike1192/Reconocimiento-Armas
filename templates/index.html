<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Detección de Armas</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>🔫 Sistema de Detección de Armas</h1>
        <p class="subtitle">Detección en tiempo real con YOLOv8</p>
      </header>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Left Panel - Video -->
        <div class="video-panel">
          <div class="video-container">
            <h2>Video en Tiempo Real</h2>
            <div class="video-wrapper">
              <img
                src="{{ url_for('video_feed') }}"
                alt="Video Feed"
                id="video-stream"
              />
            </div>

            <!-- Controls -->
            <div class="controls">
              <button id="toggle-detection" class="btn btn-primary">
                Desactivar Detección
              </button>
              <button id="capture-btn" class="btn btn-secondary">
                Capturar Frame
              </button>
              <div class="slider-container">
                <label for="confidence-slider">Umbral de Confianza:</label>
                <input
                  type="range"
                  id="confidence-slider"
                  min="10"
                  max="100"
                  value="50"
                />
                <span id="confidence-value">50%</span>
              </div>
            </div>
          </div>

          <!-- Alerts Panel -->
          <div class="alerts-panel">
            <h3>Alertas</h3>
            <div id="alerts-container" class="alerts-container">
              <p class="no-alerts">No hay alertas recientes</p>
            </div>
          </div>
        </div>

        <!-- Right Panel - Detections -->
        <div class="detections-panel">
          <h2>Detecciones</h2>

          <!-- Statistics -->
          <div class="stats-container">
            <div class="stat-card">
              <div class="stat-value" id="total-detections">0</div>
              <div class="stat-label">Total</div>
            </div>
            <div class="stat-card high-alert">
              <div class="stat-value" id="high-alerts">0</div>
              <div class="stat-label">Alertas Altas</div>
            </div>
            <div class="stat-card medium-alert">
              <div class="stat-value" id="medium-alerts">0</div>
              <div class="stat-label">Alertas Medias</div>
            </div>
          </div>

          <!-- Detections List -->
          <div class="detections-list" id="detections-list">
            <p class="no-detections">No hay detecciones aún</p>
          </div>

          <!-- Actions -->
          <div class="actions">
            <button id="clear-btn" class="btn btn-danger">Limpiar Lista</button>
            <button id="export-btn" class="btn btn-success">
              Exportar Datos
            </button>
            <button id="refresh-btn" class="btn btn-info">Actualizar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal for Detection Details -->
    <div id="detection-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Detalles de Detección</h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
